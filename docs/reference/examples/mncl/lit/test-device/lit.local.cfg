# test-device suite: 実機 backend で examples を走らせる
# 必要ツール (clang / ninja / assemble3) + 実機判定 (gpfn3-smi) を確認
# 実機が無ければ suite ごと UNSUPPORTED (= host では skip、pod では実行)

import shutil

for tool in ['clang', 'ninja', 'assemble3']:
    if not shutil.which(tool):
        config.unsupported = True
        break
else:
    # 実機判定: gpfn3-smi が PATH にあれば device feature 有効
    if not shutil.which('gpfn3-smi'):
        config.unsupported = True

# HW 共有資源、1 worker 直列化
config.parallelism_group = "device"
